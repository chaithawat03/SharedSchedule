services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedschedule
      POSTGRES_USER: sharedschedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - sharedschedule_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharedschedule -d sharedschedule"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sharedschedule_pgdata:
